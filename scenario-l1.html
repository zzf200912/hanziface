let curLesson=0, path=[];
function say(t){if(!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(t);u.lang="zh-CN";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}
function lineHTML(d){
  const c=ROLES[d.who]||ROLES.me;
  return `<div class="bubble ${c.cls}"><div class="who"><span class="dot" style="background:${c.color}"></span>${c.name}<span class="en">${c.en}</span></div>
    <div class="zh">${d.zh}<button class="say" onclick="say('${d.zh.replace(/'/g,"\\'")}')">🔊</button></div>
    <div class="py">${d.py}</div><div class="en">${d.en}</div></div>`;
}
function nodeName(c,id){if(c.names&&c.names[id])return c.names[id];return {start:"开场",ending:"结局"}[id]||id}
function openLesson(i){curLesson=i;path=["start"];render();window.scrollTo({top:0,behavior:"smooth"})}
function render(){
  const c=COURSES[curLesson], story=c.story, cur=story[path[path.length-1]];
  document.getElementById("lessonCount").textContent=COURSES.length+" 课";
  document.getElementById("coursebar").innerHTML=COURSES.map((x,i)=>`<div class="c ${i===curLesson?"on":""}" onclick="openLesson(${i})"><b>${i+1}. ${x.title}</b><span>${x.titleEn}</span></div>`).join("");
  const sceneCode=c.scene.split("·")[0].trim();
  document.getElementById("scene").innerHTML=`<div class="kicker">${sceneCode} &middot; ${c.titleEn.toUpperCase()}</div><h1>${c.title}<span class="h1en">${c.titleEn}</span></h1><p>${c.desc}</p><p class="descen">${c.descEn||""}</p>
    <div class="cast">${c.cast.map(k=>`<span class="chip"><span class="dot" style="background:${ROLES[k].color}"></span>${ROLES[k].name}<span class="en">${ROLES[k].en}</span></span>`).join("")}</div>`;
  let html="",culture="";
  path.forEach(id=>{
    const node=story[id];
    node.lines.forEach(d=>html+=lineHTML(d));
    if(node.culture)culture+=`<div class="culture">${node.culture}</div>`;
    if(node!==cur&&node.prompt)html+=`<div class="prompt" style="opacity:.6"><div class="q">你选择了：${node.opts.find(o=>o.to===path[path.indexOf(id)+1])?.label||""}</div></div>`;
  });
  document.getElementById("dlg").innerHTML=html+culture;
  const names=path.map(id=>nodeName(c,id));
  document.getElementById("trail").innerHTML="剧情路径：<b>"+names.join("</b><span class='sep'> → </span><b>")+"</b>";
  const ctr=document.getElementById("controls");
  if(cur.end){
    markScenarioDone();
    const next=curLesson<COURSES.length-1;
    ctr.innerHTML=`<div class="end"><div class="big">🎬</div><h2>剧情完成</h2>
      <div class="paths">你走的是：<b>${names.slice(0,-1).join(" → ")}</b> 路线</div>
      <p style="font-size:13px;color:var(--muted)">这一幕你读了 <b>${path.reduce((n,id)=>n+story[id].lines.length,0)}</b> 句真实对话，遇到 <b>${path.filter(id=>story[id].prompt).length}</b> 个选择点。<br>重来一次走另一条路线，对话内容会不同——这就是「情境连续对话」。</p>
      <div style="margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-red" onclick="restart()">↻ 重来，试试另一条路线</button>
        <button class="btn btn-ghost" onclick="openCertModal()">🎓 领取结业证书</button>
        ${next?'<button class="btn btn-ghost" onclick="openLesson('+(curLesson+1)+')">下一课：'+COURSES[curLesson+1].title+' →</button>':''}
      </div></div>`;
  }else if(cur.prompt){
    ctr.innerHTML=`<div class="prompt"><div class="q">${cur.prompt.zh}<br><span style="font-weight:400;color:var(--muted);font-size:12px">${cur.prompt.en}</span></div>
      <div class="opts">${cur.opts.map((o,i)=>`<button class="opt" onclick="pick('${o.to}')"><span class="n">${i+1}</span>${o.label}<span class="sub">${o.en}</span></button>`).join("")}</div></div>`;
  }else{
    ctr.innerHTML=`<button class="btn btn-red" onclick="pick('${cur.to}')">继续剧情 →</button>`;
  }
}
function pick(to){path.push(to);render();window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"})}
function restart(){path=["start"];render();window.scrollTo({top:0,behavior:"smooth"})}

// ===== Digital certificate (commemorative, scenario line) =====
const CERT_KEY_S="mh_cert_scenario_v1";
function courseId(){return (COURSES[curLesson]&&COURSES[curLesson].id)||""}
function markScenarioDone(){try{let a=JSON.parse(localStorage.getItem(CERT_KEY_S)||"[]");if(!a.includes(courseId())){a.push(courseId());localStorage.setItem(CERT_KEY_S,JSON.stringify(a))}}catch(e){}}
function scenarioDoneCount(){try{return JSON.parse(localStorage.getItem(CERT_KEY_S)||"[]").length}catch(e){return 0}}
function openCertModal(){
  const box=document.createElement("div");box.className="certmodal";
  box.innerHTML='<div class="certcard"><h3>🎓 领取数字结业证书</h3>'+
    '<p class="note">这是参与证明（纪念证书），非官方学历或资质认证。证书上的姓名仅保存在你的浏览器，不会上传。</p>'+
    '<label>证书上的姓名 / Name on certificate</label>'+
    '<input id="certName" placeholder="Your name" value="Learner">'+
    '<div class="certmeta">已完成情境对话 <b>'+scenarioDoneCount()+'</b> 门 · 涵盖 HSK1–6+</div>'+
    '<div class="certbtns"><button class="btn btn-ghost" onclick="this.closest(\'.certmodal\').remove()">取消</button>'+
    '<button class="btn btn-red" onclick="downloadCert()">生成并下载 PNG</button></div></div>';
  document.body.appendChild(box);
}
function downloadCert(){
  const cv=document.createElement("canvas");cv.width=1200;cv.height=850;const c=cv.getContext("2d");
  const g=c.createLinearGradient(0,0,1200,850);
  g.addColorStop(0,"#0d203c");g.addColorStop(.5,"#16305a");g.addColorStop(1,"#0d203c");
  c.fillStyle=g;c.fillRect(0,0,1200,850);
  c.strokeStyle="#d4af37";c.lineWidth=10;c.strokeRect(28,28,1144,794);
  c.strokeStyle="#b89a4a";c.lineWidth=2;c.strokeRect(48,48,1104,754);
  [[72,72],[1128,72],[72,778],[1128,778]].forEach(([x,y])=>{c.save();c.translate(x,y);c.rotate(Math.PI/4);c.fillStyle="#d4af37";c.fillRect(-7,-7,14,14);c.restore()});
  c.textAlign="center";
  c.fillStyle="#e8c96b";c.font="bold 32px Georgia";c.fillText("HANZIFACE",600,138);
  c.fillStyle="#b89a4a";c.font="15px Georgia";c.fillText("·  EST. 2026  ·",600,170);
  c.fillStyle="#f5ecd7";c.font="bold 52px Georgia";c.fillText("Certificate of Completion",600,240);
  c.fillStyle="#d4af37";c.font="24px 'PingFang SC','Microsoft YaHei',Arial";c.fillText("结 业 证 书 · 情境连续对话",600,290);
  c.strokeStyle="#b89a4a";c.lineWidth=1;c.beginPath();c.moveTo(430,315);c.lineTo(770,315);c.stroke();
  c.fillStyle="#c9b98a";c.font="22px Arial";c.fillText("This is to certify that / 兹证明",600,360);
  c.fillStyle="#ffffff";c.font="bold 56px Georgia";c.fillText(name,600,435);
  c.strokeStyle="#d4af37";c.lineWidth=2;c.beginPath();c.moveTo(400,455);c.lineTo(800,455);c.stroke();
  c.fillStyle="#e8dcc0";c.font="24px Arial";
  c.fillText("has completed "+scenarioDoneCount()+" scenario dialogue lessons (HSK1-6+)",600,510);
  c.fillText("已完成 "+scenarioDoneCount()+" 门情境对话课程，涵盖 HSK1–6+",600,550);
  const d=new Date().toLocaleDateString("zh-CN");
  c.fillStyle="#c9b98a";c.font="20px Arial";c.fillText("Issued on "+d,600,635);
  c.fillStyle="#8f9bb3";c.font="italic 17px Arial";
  c.fillText("Digital certificate of participation - not an official academic credential",600,748);
  c.fillText("数字参与证明 - 非官方学历或资质认证",600,776);
  const a=document.createElement("a");a.download="HanziFace-情境对话结业证书.png";a.href=cv.toDataURL("image/png");a.click();
  const box=document.querySelector(".certmodal");if(box)box.remove();
}
render();
</script>
